<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Side Project</title>
  <meta name="description" content="A generative text installation: a small language model continually feeding its own output back as input.">
  <link rel="icon" type="image/png" href="public/tsp_logo.png">
  <!-- html2canvas for capturing canvas screenshot -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    /* Load Unifont for multi-language support */
    @font-face {
      font-family: 'Unifont';
      src: url('public/unifont.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #canvas {
      background: #fff;
      color: #000;
      font-family: "Unifont", "Menlo", "Monaco", "Consolas", monospace;
      font-size: 30px;
      font-weight: normal;
      line-height: 1.2;
      letter-spacing: 0;
      padding: 24px;
      overflow: hidden;
      word-break: break-all;
      white-space: pre-wrap;
      cursor: crosshair;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="canvas"></div>

  <script type="module">
    import { DisplaySession } from './display-session.mjs';

    const API_URL = "http://localhost:7860";
    const PRINT_URL = "http://localhost:5001";
    const canvas = document.getElementById('canvas');
    let printServerAvailable = false;
    let printQueue = Promise.resolve();

    async function checkPrintServer() {
      try {
        const response = await fetch(`${PRINT_URL}/health`, {
          signal: AbortSignal.timeout(2000)
        });
        printServerAvailable = response.ok;
      } catch {
        printServerAvailable = false;
      }
      console.log('Print server:', printServerAvailable ? 'available' : 'not available');
    }

    // Freeze the old square before the session clears it. Rendering and printing
    // use this separate copy, so the next round can start immediately.
    function savePage(text) {
      if (!printServerAvailable) return;
      const snapshot = canvas.cloneNode(true);
      snapshot.removeAttribute('id');
      snapshot.setAttribute('aria-hidden', 'true');
      const appearance = getComputedStyle(canvas);
      for (const property of appearance) {
        snapshot.style.setProperty(property, appearance.getPropertyValue(property));
      }
      const size = canvas.getBoundingClientRect();
      snapshot.style.width = `${size.width}px`;
      snapshot.style.height = `${size.height}px`;
      snapshot.style.position = 'fixed';
      snapshot.style.left = '-10000px';
      snapshot.style.top = '0';
      snapshot.style.pointerEvents = 'none';
      snapshot.textContent = text;
      document.body.appendChild(snapshot);
      printQueue = printQueue.then(() => printSnapshot(snapshot));
    }

    async function printSnapshot(snapshot) {
      try {
        const screenshot = await html2canvas(snapshot, {
          backgroundColor: '#ffffff',
          scale: 2,
        });
        const response = await fetch(`${PRINT_URL}/print-image`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: screenshot.toDataURL('image/png') }),
          signal: AbortSignal.timeout(15000)
        });
        if (!response.ok) throw new Error(`Print error: ${response.status}`);
      } catch (error) {
        console.error('Print error:', error);
      } finally {
        snapshot.remove();
      }
    }

    const session = new DisplaySession({
      url: API_URL,
      savePage,
      render(text) {
        canvas.textContent = text;
        return canvas.scrollHeight > canvas.clientHeight;
      },
    });

    function resizeCanvas() {
      const size = Math.min(window.innerWidth, window.innerHeight) * 0.95;
      canvas.style.width = `${size}px`;
      canvas.style.height = `${size}px`;
      if (canvas.scrollHeight > canvas.clientHeight) void session.restart();
    }

    window.addEventListener('resize', resizeCanvas);
    canvas.addEventListener('click', () => { void session.restart(); });
    canvas.addEventListener('touchstart', event => {
      event.preventDefault();
      void session.restart();
    });

    checkPrintServer();
    resizeCanvas();
    void session.restart();
  </script>
</body>
</html>
